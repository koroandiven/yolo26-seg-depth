# NYU + KITTI Mixed Depth Dataset for YOLO26 Depth+Segmentation
# Phase B: Cross-scene generalization (indoor + outdoor)
#
# Design choices:
#   - Unified depth_scale=100.0 (scheme B from ROADMAP). NYU clips to 10m,
#     KITTI clips to 80m. Simple but wastes some sigmoid resolution for NYU.
#   - Segmentation head remains frozen (COCO 80-class). Dataset-specific
#     segmentation labels are NOT used for gradient updates.
#   - KITTI sparse depth handled by valid_mask (depth_target > 0) in loss.

path: /d01/training_data/yolo-other/yolo26-seg-depth

# Compatibility fields for Ultralytics check_det_dataset
train: nyu_yolo/images/train
val: nyu_yolo/images/test

# Multi-source configuration (consumed by DepthSegmentTrainer.build_dataset)
sources:
  nyu:
    train: nyu_yolo/images/train
    val: nyu_yolo/images/test
    depth_max: 10.0
    weight: 1.0
  kitti:
    train: kitti_yolo_final/images/train
    val: kitti_yolo_final/images/val
    depth_max: 80.0
    weight: 1.0

# COCO 80 classes (model head is frozen, do NOT change)
nc: 80
